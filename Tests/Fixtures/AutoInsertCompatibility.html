<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KotodamaVoice Auto Insert Compatibility</title>
    <style>
      body {
        max-width: 48rem;
        margin: 4rem auto;
        padding: 0 2rem;
        font: 18px system-ui, sans-serif;
      }

      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 10rem;
        padding: 1rem;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <h1>Auto Insert Compatibility</h1>
    <label for="target">「置換対象」だけを選択してください</label>
    <textarea id="target" autofocus>前方［置換対象］後方</textarea>
  </body>
</html>
