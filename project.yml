name: KotodamaVoice
options:
  bundleIdPrefix: jp.tsuyuki
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "26.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    ARCHS: arm64
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ONLY_ACTIVE_ARCH: NO
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: B7VP34NYD2
    CODE_SIGN_STYLE: Automatic
targets:
  KotodamaCore:
    type: framework
    platform: macOS
    sources:
      - Sources/KotodamaCore
    info:
      path: Config/KotodamaCore-Info.plist
      properties:
        CFBundlePackageType: FMWK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tsuyuki.KotodamaVoice.Core
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
    preBuildScripts:
      - name: Verify Core dependencies
        script: Scripts/verify-core-dependencies.sh
        basedOnDependencyAnalysis: false
  SpeechWorker:
    type: xpc-service
    platform: macOS
    sources:
      - Sources/SpeechWorker
    dependencies:
      - target: KotodamaCore
        embed: true
        codeSign: true
      - framework: .build/runtimes/artifacts/whisper.xcframework
        embed: true
        codeSign: true
    info:
      path: Config/SpeechWorker-Info.plist
      properties:
        CFBundleDisplayName: KotodamaVoice Speech Worker
        CFBundlePackageType: XPC!
        XPCService:
          ServiceType: Application
          RunLoopType: dispatch_main
    entitlements:
      path: Config/SpeechWorker.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.tsuyuki.KotodamaVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tsuyuki.KotodamaVoice.worker.speech
        ENABLE_HARDENED_RUNTIME: YES
        REGISTER_APP_GROUPS: YES
        SKIP_INSTALL: YES
  SpeechEvaluator:
    type: tool
    platform: macOS
    sources:
      - Tools/SpeechEvaluator
      - Sources/SpeechWorker/SpeechRuntime.swift
    dependencies:
      - target: KotodamaCore
      - framework: .build/runtimes/artifacts/whisper.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tsuyuki.KotodamaVoice.SpeechEvaluator
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path"
  FormatterEvaluator:
    type: tool
    platform: macOS
    sources:
      - Tools/FormatterEvaluator
      - Sources/FormatterWorker/FormatterRuntime.swift
    dependencies:
      - target: KotodamaCore
      - framework: .build/runtimes/artifacts/llama.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tsuyuki.KotodamaVoice.FormatterEvaluator
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path"
  FormatterWorker:
    type: xpc-service
    platform: macOS
    sources:
      - Sources/FormatterWorker
    dependencies:
      - target: KotodamaCore
        embed: true
        codeSign: true
      - framework: .build/runtimes/artifacts/llama.xcframework
        embed: true
        codeSign: true
    info:
      path: Config/FormatterWorker-Info.plist
      properties:
        CFBundleDisplayName: KotodamaVoice Formatter Worker
        CFBundlePackageType: XPC!
        XPCService:
          ServiceType: Application
          RunLoopType: dispatch_main
    entitlements:
      path: Config/FormatterWorker.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.tsuyuki.KotodamaVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tsuyuki.KotodamaVoice.worker.formatter
        ENABLE_HARDENED_RUNTIME: YES
        REGISTER_APP_GROUPS: YES
        SKIP_INSTALL: YES
  KotodamaVoice:
    type: application
    platform: macOS
    sources:
      - Sources/KotodamaVoice
      - path: Resources
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: Licenses
        buildPhase: resources
    dependencies:
      - target: KotodamaCore
      - target: SpeechWorker
        embed: true
      - target: FormatterWorker
        embed: true
    info:
      path: Config/KotodamaVoice-Info.plist
      properties:
        CFBundleDisplayName: KotodamaVoice
        CFBundleName: KotodamaVoice
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSMicrophoneUsageDescription: 音声を文字に変換するためにマイクを使用します。
    entitlements:
      path: Config/KotodamaVoice.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.tsuyuki.KotodamaVoice
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tsuyuki.KotodamaVoice
        ENABLE_HARDENED_RUNTIME: YES
        LD_GENERATE_MAP_FILE: YES
        REGISTER_APP_GROUPS: YES
  KotodamaCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/KotodamaCoreTests
    dependencies:
      - target: KotodamaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tsuyuki.KotodamaVoice.CoreTests
        GENERATE_INFOPLIST_FILE: YES
  KotodamaVoiceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/KotodamaVoiceTests
    dependencies:
      - target: KotodamaVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tsuyuki.KotodamaVoice.Tests
        GENERATE_INFOPLIST_FILE: YES
  SpeechWorkerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/SpeechWorkerTests
      - Sources/SpeechWorker/SpeechRuntime.swift
    dependencies:
      - target: KotodamaCore
      - framework: .build/runtimes/artifacts/whisper.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tsuyuki.KotodamaVoice.SpeechWorkerTests
        GENERATE_INFOPLIST_FILE: YES
    preBuildScripts:
      - name: Prepare speech test fixtures
        script: Scripts/prepare-speech-test-fixtures.sh
        basedOnDependencyAnalysis: false
  FormatterWorkerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/FormatterWorkerTests
      - Sources/FormatterWorker/FormatterRuntime.swift
    dependencies:
      - target: KotodamaCore
      - framework: .build/runtimes/artifacts/llama.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tsuyuki.KotodamaVoice.FormatterWorkerTests
        GENERATE_INFOPLIST_FILE: YES
  KotodamaVoiceUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/KotodamaVoiceUITests
    dependencies:
      - target: KotodamaVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tsuyuki.KotodamaVoice.UITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KotodamaVoice:
    build:
      targets:
        KotodamaVoice: all
        KotodamaCore: all
        SpeechWorker: all
        FormatterWorker: all
    test:
      environmentVariables:
        KOTODAMA_OFFLINE_REQUIRED: "$(KOTODAMA_OFFLINE_REQUIRED)"
        KOTODAMA_OFFLINE_MODEL: "$(KOTODAMA_OFFLINE_MODEL)"
        KOTODAMA_OFFLINE_AUDIO: "$(KOTODAMA_OFFLINE_AUDIO)"
      targets:
        - KotodamaCoreTests
        - KotodamaVoiceTests
        - KotodamaVoiceUITests
        - SpeechWorkerTests
        - FormatterWorkerTests
  KotodamaCore:
    build:
      targets:
        KotodamaCore: all
    test:
      targets:
        - KotodamaCoreTests
  KotodamaVoiceUnitTests:
    build:
      targets:
        KotodamaVoice: all
        KotodamaVoiceTests: [test]
    test:
      targets:
        - KotodamaVoiceTests
  SpeechWorker:
    build:
      targets:
        SpeechWorker: all
    test:
      targets:
        - SpeechWorkerTests
  SpeechEvaluator:
    build:
      targets:
        SpeechEvaluator: all
  FormatterEvaluator:
    build:
      targets:
        FormatterEvaluator: all
  FormatterWorker:
    build:
      targets:
        FormatterWorker: all
    test:
      environmentVariables:
        KOTODAMA_FORMATTER_MODEL: "$(KOTODAMA_FORMATTER_MODEL)"
      targets:
        - FormatterWorkerTests
